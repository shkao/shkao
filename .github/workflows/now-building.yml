name: Update profile activity

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test activity generator
        run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/update_now_building.py
      - name: Generate public project activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_public_activity.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md assets/public-project-activity.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git add assets/public-project-activity.svg
            git commit -m "chore(readme): refresh profile activity"
            git push
          fi
